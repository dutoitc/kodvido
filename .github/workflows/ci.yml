name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, integration tests and coverage gates
        run: mvn -B --no-transfer-progress clean verify
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/**
          retention-days: 7
      - name: Runnable application
        uses: actions/upload-artifact@v4
        with:
          name: kodvido-${{ matrix.os }}
          path: kodvido-app/target/kodvido-app-*.jar
          retention-days: 7
